name: reworth_mobile
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  google_fonts: ^8.1.0
  supabase_flutter: ^2.12.4
  geolocator: ^14.0.2
  http: ^1.6.0
  intl: ^0.20.2
  curved_navigation_bar: ^1.0.6
  flutter_map: ^8.3.0
  url_launcher: ^6.3.2
  url_launcher_android: ^6.3.29
  url_launcher_ios: ^6.4.1
  url_launcher_web: ^2.4.3
  image_picker: ^1.2.2
  image_picker_for_web: ^3.1.1
  camera: ^0.12.0+1
  geocoding: ^4.0.0
  path: ^1.9.1
  image: ^4.0.14
  flutter_image_compress: ^2.3.0
  path_provider: ^2.0.11
  dotted_border: ^2.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
  - assets/logo.png
  - assets/gradient.png
  - assets/banner_reward/1.png
  - assets/banner_reward/2.png
  - assets/banner_reward/3.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_apk.png"

flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: true

  android_12:
    color: "#FFFFFF"